<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/real.png" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>
      RoboFest Pakistan 2026 | Robotics, Programming & STEM Competition
    </title>

    <meta
      name="description"
      content="RoboFest Pakistan is a premier robotics and STEM festival featuring robotics, programming, STEAM and e-gaming competitions for students across Pakistan. Join RoboFest 2026 and compete, innovate and shape the future."

    <meta
      name="keywords"

    <meta name="theme-color" content="#06111f" />
